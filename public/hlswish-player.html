<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLSWish Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; font-size: 18px; color: #1db0ef; }
  #status {
    margin-bottom: 15px;
    padding: 10px 20px;
    background: #1a1a1a;
    border-radius: 8px;
    font-size: 13px;
    color: #888;
    max-width: 900px;
    word-break: break-all;
  }
  #status.ok { color: #22c55e; }
  #status.error { color: #ef4444; }
  #video {
    width: 100%;
    max-width: 900px;
    border-radius: 12px;
    background: #000;
    aspect-ratio: 16/9;
  }
  #tracks-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    max-width: 900px;
    width: 100%;
    justify-content: center;
  }
  #tracks-bar select, #tracks-bar button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 13px;
  }
  #logs {
    margin-top: 15px;
    padding: 15px;
    background: #111;
    border-radius: 8px;
    width: 100%;
    max-width: 900px;
    max-height: 220px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    color: #666;
  }
  #logs .log-ok { color: #22c55e; }
  #logs .log-err { color: #ef4444; }
  #logs .log-info { color: #3b82f6; }
  #logs .log-warn { color: #f59e0b; }
  .btn {
    margin-top: 10px;
    padding: 10px 24px;
    background: #1db0ef;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .btn:hover { background: #0ea5e9; }
  .btn:disabled { background: #444; cursor: not-allowed; }
</style>
</head>
<body>

<h1>🎬 HLSWish / StreamHG Player</h1>
<div id="status">Esperando...</div>
<video id="video" controls playsinline crossorigin="anonymous"></video>
<div id="tracks-bar">
  <label>Audio <select id="selAudio" disabled><option>—</option></select></label>
  <label>Subs <select id="selSubs" disabled><option>Off</option></select></label>
  <label>Calidad <select id="selLevel" disabled><option>Auto</option></select></label>
</div>
<button class="btn" id="btnRetry" onclick="start()" disabled>Reintentar</button>
<div id="logs"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(function () {
  'use strict';

  // ─── CONFIG ────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const EMBED_URL = params.get('embed') || 'https://hlswish.com/e/yva27fzm2d3b';
  // Opcional: proxy tipo Cloudflare Worker (mismo patrón que goodstream)
  // Si está vacío, intenta fetch directo + CORS; si falla, usa el proxy.
  const PROXY_BASE = params.get('proxy') || 'https://goodstream-proxy-render.ff15.workers.dev/?url=';

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const logs = document.getElementById('logs');
  const btnRetry = document.getElementById('btnRetry');
  const selAudio = document.getElementById('selAudio');
  const selSubs = document.getElementById('selSubs');
  const selLevel = document.getElementById('selLevel');

  let hlsInstance = null;
  let subtitleTracks = []; // { label, file, default }

  function log(msg, type) {
    type = type || 'info';
    const div = document.createElement('div');
    div.className = 'log-' + type;
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logs.appendChild(div);
    logs.scrollTop = logs.scrollHeight;
    console.log(msg);
  }

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = cls || '';
  }

  function viaProxy(url) {
    if (!PROXY_BASE) return url;
    return PROXY_BASE + encodeURIComponent(url);
  }

  async function fetchText(url) {
    // 1) proxy
    if (PROXY_BASE) {
      try {
        const res = await fetch(viaProxy(url));
        if (res.ok) return await res.text();
        log('Proxy HTTP ' + res.status + ' para ' + url.slice(0, 60), 'warn');
      } catch (e) {
        log('Proxy error: ' + e.message, 'warn');
      }
    }
    // 2) directo
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' al cargar ' + url);
    return await res.text();
  }

  // ─── Desempaquetar packer de hlswish ───────────────────────
  function unpackPacker(html) {
    const m = html.match(
      /eval\(function\(p,a,c,k,e,d\)\{while\(c--\)if\(k\[c\]\)p=p\.replace\(new RegExp\('\\\\b'\+c\.toString\(a\)\+'\\\\b','g'\),k\[c\]\);return p\}\('((?:\\'|[^'])*)'\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*'((?:\\'|[^'])*)'\.split\('\|'\)/
    );
    if (!m) return null;

    const p = m[1];
    const a = parseInt(m[2], 10);
    const c = parseInt(m[3], 10);
    const k = m[4].split('|');

    function toBase(n, base) {
      if (n === 0) return '0';
      const digits = '0123456789abcdefghijklmnopqrstuvwxyz';
      let s = '';
      while (n) {
        s = digits[n % base] + s;
        n = Math.floor(n / base);
      }
      return s;
    }

    let result = p;
    for (let i = c - 1; i >= 0; i--) {
      if (i < k.length && k[i]) {
        const token = toBase(i, a);
        result = result.replace(
          new RegExp('\\b' + token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g'),
          k[i]
        );
      }
    }
    return result;
  }

  function extractMedia(html, pageOrigin) {
    const result = { links: {}, captions: [], image: null, duration: null };

    const unpacked = unpackPacker(html);
    if (unpacked) {
      log('Packer desempaquetado (' + unpacked.length + ' chars)', 'ok');

      const linksMatch = unpacked.match(/links\s*=\s*\{([^}]+)\}/);
      if (linksMatch) {
        ['hls2', 'hls3', 'hls4'].forEach(function (key) {
          const km = linksMatch[1].match(new RegExp('"' + key + '"\\s*:\\s*"([^"]+)"'));
          if (km) {
            let u = km[1];
            if (u.startsWith('/')) u = pageOrigin + u;
            result.links[key] = u;
          }
        });
      }

      const tracksBlock = unpacked.match(/tracks\s*:\s*\[([^\]]+)\]/);
      if (tracksBlock) {
        const re = /\{\s*file\s*:\s*"([^"]+)"\s*,\s*label\s*:\s*"([^"]+)"\s*,\s*kind\s*:\s*"([^"]+)"(?:\s*,\s*"?default"?\s*:\s*(true))?/g;
        let tm;
        while ((tm = re.exec(tracksBlock[1])) !== null) {
          if (tm[3] === 'captions') {
            result.captions.push({
              file: tm[1],
              label: tm[2],
              default: !!tm[4],
            });
          }
        }
      }

      const img = unpacked.match(/image\s*:\s*"([^"]+)"/);
      if (img) result.image = img[1];
      const dur = unpacked.match(/duration\s*:\s*"?([\d.]+)"?/);
      if (dur) result.duration = parseFloat(dur[1]);
    }

    // Fallback regex
    if (!result.links.hls2 && !result.links.hls4) {
      const gen = html.match(/(https?:\/\/[^"'\s]+\.m3u8[^"'\s]*)/i);
      if (gen) result.links.regex = gen[1];
      const rel = html.match(/["'](\/stream\/[^"']+\.m3u8)["']/i);
      if (rel) result.links.hls4 = pageOrigin + rel[1];
    }
    if (!result.captions.length) {
      const vtts = [...html.matchAll(/(https?:\/\/[^"'\s]+\.vtt)/gi)];
      vtts.forEach(function (m, i) {
        result.captions.push({ file: m[1], label: 'Sub ' + (i + 1), default: i === 0 });
      });
    }

    return result;
  }

  // ─── Resolver embed ────────────────────────────────────────
  async function resolveEmbed() {
    setStatus('🔍 Resolviendo embed HLSWish...');
    log('Embed: ' + EMBED_URL, 'info');

    const html = await fetchText(EMBED_URL);
    log('HTML recibido: ' + html.length + ' chars', 'ok');

    const origin = new URL(EMBED_URL).origin;
    const media = extractMedia(html, origin);

    const order = ['hls4', 'hls2', 'hls3', 'regex'];
    let m3u8Url = null;
    for (let i = 0; i < order.length; i++) {
      if (media.links[order[i]]) {
        m3u8Url = media.links[order[i]];
        log('Usando ' + order[i] + ': ' + m3u8Url.slice(0, 90) + '...', 'ok');
        break;
      }
    }

    if (!m3u8Url) {
      log('HTML (500 chars): ' + html.slice(0, 500), 'err');
      throw new Error('No se encontró master .m3u8 en el embed');
    }

    if (m3u8Url.startsWith('//')) m3u8Url = 'https:' + m3u8Url;
    else if (m3u8Url.startsWith('/')) m3u8Url = origin + m3u8Url;

    subtitleTracks = media.captions || [];
    log('Subtítulos: ' + subtitleTracks.length, 'info');
    subtitleTracks.forEach(function (t) {
      log('  📝 ' + t.label + (t.default ? ' (default)' : '') + ' → ' + t.file.slice(0, 70), 'info');
    });

    if (media.duration) log('Duración reportada: ' + media.duration + 's', 'info');
    if (media.image) {
      video.poster = media.image;
    }

    return m3u8Url;
  }

  // ─── UI de pistas ──────────────────────────────────────────
  function fillSubtitleSelect() {
    selSubs.innerHTML = '<option value="">Off</option>';
    subtitleTracks.forEach(function (t, i) {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = t.label;
      if (t.default) opt.selected = true;
      selSubs.appendChild(opt);
    });
    selSubs.disabled = subtitleTracks.length === 0;
    if (subtitleTracks.some(function (t) { return t.default; })) {
      applySubtitle(selSubs.value);
    }
  }

  function applySubtitle(indexStr) {
    // limpiar tracks previos del <video>
    [...video.querySelectorAll('track')].forEach(function (tr) { tr.remove(); });
    if (indexStr === '' || indexStr == null) return;
    const t = subtitleTracks[parseInt(indexStr, 10)];
    if (!t) return;
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = t.label;
    track.srclang = /eng|en/i.test(t.label) ? 'en' : 'es';
    // VTT vía proxy si hace falta CORS
    track.src = PROXY_BASE ? viaProxy(t.file) : t.file;
    track.default = true;
    video.appendChild(track);
    // activar
    setTimeout(function () {
      if (video.textTracks[0]) video.textTracks[0].mode = 'showing';
    }, 300);
    log('Subtítulo activo: ' + t.label, 'ok');
  }

  selSubs.addEventListener('change', function () {
    applySubtitle(selSubs.value);
  });

  function fillAudioSelect(hls) {
    selAudio.innerHTML = '';
    const tracks = hls.audioTracks || [];
    if (!tracks.length) {
      selAudio.innerHTML = '<option>Sin pistas</option>';
      selAudio.disabled = true;
      return;
    }
    tracks.forEach(function (t, i) {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = t.name || t.lang || ('Audio ' + i);
      if (i === hls.audioTrack) opt.selected = true;
      selAudio.appendChild(opt);
    });
    selAudio.disabled = false;
    // Preferir Español si existe
    const esIdx = tracks.findIndex(function (t) {
      return /espa[ñn]ol|spanish|es/i.test(t.name || t.lang || '');
    });
    if (esIdx >= 0) {
      hls.audioTrack = esIdx;
      selAudio.value = String(esIdx);
      log('Audio por defecto: ' + (tracks[esIdx].name || tracks[esIdx].lang), 'ok');
    }
  }

  selAudio.addEventListener('change', function () {
    if (!hlsInstance) return;
    hlsInstance.audioTrack = parseInt(selAudio.value, 10);
    log('Audio cambiado a índice ' + selAudio.value, 'info');
  });

  function fillLevelSelect(hls) {
    selLevel.innerHTML = '<option value="-1">Auto</option>';
    (hls.levels || []).forEach(function (lvl, i) {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = (lvl.height ? lvl.height + 'p' : 'nivel ' + i) +
        (lvl.bitrate ? ' · ' + Math.round(lvl.bitrate / 1000) + 'kbps' : '');
      selLevel.appendChild(opt);
    });
    selLevel.disabled = !hls.levels || hls.levels.length === 0;
  }

  selLevel.addEventListener('change', function () {
    if (!hlsInstance) return;
    hlsInstance.currentLevel = parseInt(selLevel.value, 10);
    log('Nivel manual: ' + selLevel.value, 'info');
  });

  // ─── Reproducir ────────────────────────────────────────────
  function playM3U8(url) {
    setStatus('🚀 Cargando stream HLS...');

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    if (!Hls.isSupported()) {
      // Safari nativo
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        fillSubtitleSelect();
        setStatus('✅ Reproduciendo (HLS nativo)', 'ok');
        return;
      }
      setStatus('HLS.js no soportado', 'error');
      return;
    }

    const loadUrl = PROXY_BASE ? viaProxy(url) : url;
    log('Cargando: ' + loadUrl.slice(0, 90) + '...', 'info');

    const hls = new Hls({
      maxBufferLength: 60,
      maxMaxBufferLength: 120,
      enableWorker: true,
      // Si el proxy reescribe segmentos, a veces hace falta:
      // xhrSetup: function (xhr) { /* headers extra */ }
    });
    hlsInstance = hls;

    hls.loadSource(loadUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function (e, data) {
      setStatus('✅ Listo — ' + data.levels.length + ' calidades · ' + (hls.audioTracks?.length || 0) + ' audios', 'ok');
      log('Manifest: ' + data.levels.length + ' niveles, audioTracks=' + (hls.audioTracks?.length || 0), 'ok');
      fillLevelSelect(hls);
      fillAudioSelect(hls);
      fillSubtitleSelect();
      video.play().catch(function (err) {
        log('Autoplay bloqueado: ' + err.message, 'warn');
      });
    });

    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function () {
      fillAudioSelect(hls);
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, function (e, data) {
      const lvl = hls.levels[data.level];
      if (lvl) log('Calidad: ' + (lvl.height || '?') + 'p', 'info');
    });

    hls.on(Hls.Events.ERROR, function (e, data) {
      const msg = data.response && data.response.code
        ? 'HTTP ' + data.response.code
        : data.details;
      log('ERROR: ' + msg + ' | fatal=' + data.fatal + ' | type=' + data.type, 'err');
      if (data.fatal) {
        setStatus('❌ Error fatal: ' + msg, 'error');
        if (data.response && data.response.code === 403) {
          log('Token/IP: prueba otro proxy o abre el embed en la misma red.', 'err');
        }
        btnRetry.disabled = false;
      }
    });

    video.addEventListener('playing', function () { log('▶️ PLAYING', 'ok'); });
    video.addEventListener('waiting', function () { log('⏳ Buffering...', 'info'); });
  }

  // ─── Main ──────────────────────────────────────────────────
  async function start() {
    logs.innerHTML = '';
    btnRetry.disabled = true;
    setStatus('Iniciando...');
    try {
      const m3u8Url = await resolveEmbed();
      playM3U8(m3u8Url);
    } catch (err) {
      setStatus('❌ ' + err.message, 'error');
      log('Error: ' + err.message, 'err');
      btnRetry.disabled = false;
    }
  }

  window.start = start;
  start();
})();
</script>
</body>
</html>
