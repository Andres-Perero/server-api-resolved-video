<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodStream Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; font-size: 18px; color: #e11d48; }
  #status {
    margin-bottom: 15px;
    padding: 10px 20px;
    background: #1a1a1a;
    border-radius: 8px;
    font-size: 13px;
    color: #888;
    max-width: 800px;
    word-break: break-all;
  }
  #status.ok { color: #22c55e; }
  #status.error { color: #ef4444; }
  #video {
    width: 100%;
    max-width: 900px;
    border-radius: 12px;
    background: #000;
    aspect-ratio: 16/9;
  }
  #logs {
    margin-top: 15px;
    padding: 15px;
    background: #111;
    border-radius: 8px;
    width: 100%;
    max-width: 900px;
    max-height: 200px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    color: #666;
  }
  #logs .log-ok { color: #22c55e; }
  #logs .log-err { color: #ef4444; }
  #logs .log-info { color: #3b82f6; }
  #logs .log-warn { color: #f59e0b; }
  .btn {
    margin-top: 10px;
    padding: 10px 24px;
    background: #e11d48;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .btn:hover { background: #be123c; }
  .btn:disabled { background: #444; cursor: not-allowed; }
</style>
</head>
<body>

<h1>🎬 GoodStream Player (Resolución en Navegador)</h1>
<div id="status">Esperando...</div>
<video id="video" controls playsinline></video>
<button class="btn" id="btnRetry" onclick="start()" disabled>Reintentar</button>
<div id="logs"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(function() {
  'use strict';

  // ─── CONFIGURACIÓN ─────────────────────────────────────────
// ─── CONFIGURACIÓN ─────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const EMBED_URL = params.get('embed');
const VIDEO_TITLE = params.get('title') || 'GoodStream Video';

if (!EMBED_URL) {
  document.getElementById('status').textContent = '❌ Falta el parámetro ?embed=';
  document.getElementById('status').className = 'error';
  throw new Error('Falta ?embed= en la URL');
}

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const logs = document.getElementById('logs');
  const btnRetry = document.getElementById('btnRetry');
  let hlsInstance = null;

  function log(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = 'log-' + type;
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logs.appendChild(div);
    logs.scrollTop = logs.scrollHeight;
    console.log(msg);
  }

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = cls || '';
  }

  // ─── CUSTOM LOADER: Headers Referer/Origin ─────────────────
  class GoodstreamLoader extends Hls.DefaultConfig.loader {
    load(context, config, callbacks) {
      const url = context.url;
      if (url.includes('goodstream')) {
        context.headers = context.headers || {};
        context.headers['Referer'] = EMBED_URL;
        context.headers['Origin'] = 'https://goodstream.one';
      }
      return super.load(context, config, callbacks);
    }
  }

  // ─── RESOLUCIÓN DEL EMBED EN EL NAVEGADOR ──────────────────
  async function resolveEmbed() {
    setStatus('🔍 Resolviendo embed desde el navegador...');
    log('Embed URL: ' + EMBED_URL, 'info');

    let html = '';

   // Intento 2: Tu propio Worker (mucho más fiable)
if (!html) {
  log('Usando tu Worker de Cloudflare...', 'warn');
  try {
    const workerUrl = 'https://goodstream-proxy-render.ff15.workers.dev/?url=' + encodeURIComponent(EMBED_URL);
    const res = await fetch(workerUrl);
    if (res.ok) {
      html = await res.text();
      log('✅ Worker exitoso', 'ok');
    } else {
      log('❌ Worker respondió: ' + res.status, 'err');
    }
  } catch (e) {
    log('❌ Worker falló: ' + e.message, 'err');
  }
}

    if (!html) throw new Error('No se pudo cargar el embed. CORS bloqueado en todos los intentos.');

    // Extraer .m3u8
    log('Extrayendo URL del stream...', 'info');

    let m3u8Url = null;

    // Método 1: file: "..."
    const fileMatch = html.match(/file\s*:\s*["']([^"']+\.m3u8[^"']*)["']/i);
    if (fileMatch) {
      m3u8Url = fileMatch[1];
      log('✅ Encontrado via file:', 'ok');
    }

    // Método 2: sources: [{file:"..."}]
    if (!m3u8Url) {
      const sourcesMatch = html.match(/sources\s*:\s*\[\s*\{[^}]*file\s*:\s*["']([^"']+\.m3u8[^"']*)["'][^}]*\}/i);
      if (sourcesMatch) {
        m3u8Url = sourcesMatch[1];
        log('✅ Encontrado via sources:', 'ok');
      }
    }

    // Método 3: regex genérico
    if (!m3u8Url) {
      const genericMatch = html.match(/(https?:\/\/[^"'\s]+\.m3u8[^"'\s]*)/i);
      if (genericMatch) {
        m3u8Url = genericMatch[1];
        log('✅ Encontrado via regex genérico', 'ok');
      }
    }

    if (!m3u8Url) {
      log('HTML recibido (primeros 500 chars): ' + html.substring(0, 500), 'err');
      throw new Error('No se encontró URL .m3u8 en el embed.');
    }

    // Normalizar URL
    if (m3u8Url.startsWith('//')) m3u8Url = 'https:' + m3u8Url;
    else if (m3u8Url.startsWith('/')) m3u8Url = new URL(EMBED_URL).origin + m3u8Url;

    log('🎯 M3U8: ' + m3u8Url.substring(0, 80) + '...', 'ok');
    return m3u8Url;
  }

  // ─── REPRODUCIR M3U8 ───────────────────────────────────────
  function playM3U8(url) {
    setStatus('🚀 Cargando stream HLS...');

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    if (!Hls.isSupported()) {
      setStatus('HLS.js no soportado', 'error');
      log('HLS.js no está soportado en este navegador', 'error');
      return;
    }

    const hls = new Hls({
     // loader: GoodstreamLoader,
      maxBufferLength: 60,
      maxMaxBufferLength: 120,
      enableWorker: false,
     // xhrSetup: function(xhr, url) {
      //  if (url.includes('goodstream')) {
      //    xhr.setRequestHeader('Referer', EMBED_URL);
     //     xhr.setRequestHeader('Origin', 'https://goodstream.one');
      //  }
     // }
    });

    hlsInstance = hls;

    // Proxear el m3u8 a través del Worker
const proxiedUrl = 'https://goodstream-proxy-render.ff15.workers.dev/?url=' + encodeURIComponent(url);
log('Usando m3u8 proxied: ' + proxiedUrl.substring(0, 70) + '...', 'info');
hls.loadSource(proxiedUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_LOADING, () => {
      log('Cargando manifest...', 'info');
    });

    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
      setStatus('✅ Reproduciendo - ' + data.levels.length + ' calidades', 'ok');
      log('Manifest parseado: ' + data.levels.length + ' niveles', 'ok');
      video.play().catch(e => log('Autoplay bloqueado: ' + e.message, 'warn'));
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
      const lvl = hls.levels[data.level];
      if (lvl) log('Calidad: ' + (lvl.height || 'auto') + 'p', 'info');
    });

    hls.on(Hls.Events.ERROR, (e, data) => {
      const msg = data.response?.code ? 'HTTP ' + data.response.code : data.details;
      log('ERROR: ' + msg + ' | fatal: ' + data.fatal + ' | type: ' + data.type, 'err');

      if (data.fatal) {
        setStatus('❌ Error fatal: ' + msg, 'error');
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && data.response?.code === 403) {
          log('El token está vinculado a otra IP. El embed debe resolverse desde el navegador del usuario.', 'err');
        }
        btnRetry.disabled = false;
      }
    });

    video.addEventListener('playing', () => log('▶️ PLAYING', 'ok'));
    video.addEventListener('waiting', () => log('⏳ Buffering...', 'info'));
  }

  // ─── FLUJO PRINCIPAL ─────────────────────────────────────────
  async function start() {
    logs.innerHTML = '';
    btnRetry.disabled = true;
    setStatus('Iniciando...');

    try {
      const m3u8Url = await resolveEmbed();
      playM3U8(m3u8Url);
    } catch (err) {
      setStatus('❌ ' + err.message, 'error');
      log('Error: ' + err.message, 'err');
      btnRetry.disabled = false;
    }
  }

  // Iniciar automáticamente
  start();

})();
</script>
</body>
</html>
